<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donzy Admin Portal</title>
  <style>
    :root {
      --bg: #0b0f19;
      --card: #151c2c;
      --border: #232d42;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --stitch-blue: #38bdf8;
      --stitch-pink: #f472b6;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --danger: #ef4444;
      --success: #10b981;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; }

    .header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 1rem 2rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--stitch-blue);
    }

    .badge {
      font-size: 0.75rem;
      padding: 0.2rem 0.5rem;
      border-radius: 9999px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .badge-super { background: rgba(244, 114, 182, 0.2); color: var(--stitch-pink); border: 1px solid var(--stitch-pink); }
    .badge-admin { background: rgba(56, 189, 248, 0.2); color: var(--stitch-blue); border: 1px solid var(--stitch-blue); }

    .container { max-width: 1100px; margin: 2rem auto; padding: 0 1rem; width: 100%; flex: 1; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
    }

    .card-title { font-size: 1.1rem; font-weight: 600; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }

    .form-group { margin-bottom: 1rem; }
    label { display: block; font-size: 0.85rem; color: var(--text-muted); margin-bottom: 0.4rem; }
    input, select {
      width: 100%;
      background: #0b0f19;
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.65rem 0.75rem;
      border-radius: 0.375rem;
      font-size: 0.95rem;
    }
    input:focus, select:focus { outline: none; border-color: var(--stitch-blue); }

    .btn {
      background: var(--primary);
      color: white;
      border: none;
      padding: 0.65rem 1.2rem;
      border-radius: 0.375rem;
      cursor: pointer;
      font-weight: 600;
      transition: background 0.2s;
    }
    .btn:hover { background: var(--primary-hover); }
    .btn-danger { background: var(--danger); }
    .btn-danger:hover { background: #dc2626; }
    .btn-sm { padding: 0.35rem 0.65rem; font-size: 0.8rem; }
    .btn-secondary { background: #334155; }
    .btn-secondary:hover { background: #475569; }

    table { width: 100%; border-collapse: collapse; margin-top: 1rem; font-size: 0.9rem; }
    th, td { padding: 0.75rem; text-align: left; border-bottom: 1px solid var(--border); }
    th { color: var(--text-muted); font-size: 0.8rem; text-transform: uppercase; }

    .status-active { color: var(--success); font-weight: 600; }
    .status-suspended { color: var(--danger); font-weight: 600; }

    /* Auth screen */
    #auth-screen { max-width: 400px; margin: 5rem auto; }
  </style>
</head>
<body>

  <!-- HEADER -->
  <header class="header" id="app-header" style="display: none;">
    <div class="brand">
      <span>💙 Donzy Portal</span>
      <span class="badge" id="role-badge">Admin</span>
    </div>
    <div>
      <span id="admin-user-display" style="margin-right: 1rem; font-size: 0.9rem; color: var(--text-muted);"></span>
      <button class="btn btn-secondary btn-sm" onclick="logout()">Sign Out</button>
    </div>
  </header>

  <!-- LOGIN SCREEN -->
  <div id="auth-screen">
    <div class="card">
      <h2 style="margin-bottom: 1rem; text-align: center; color: var(--stitch-blue);">Admin Authentication</h2>
      <div id="login-error" style="color: var(--danger); font-size: 0.85rem; margin-bottom: 0.75rem; display: none;"></div>
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Username</label>
          <input type="text" id="login-username" required placeholder="superadmin">
        </div>
        <div class="form-group">
          <label>Password</label>
          <input type="password" id="login-password" required placeholder="••••••••">
        </div>
        <button class="btn" style="width: 100%;" type="submit">Log In</button>
      </form>
    </div>
  </div>

  <!-- MAIN DASHBOARD -->
  <main class="container" id="dashboard-screen" style="display: none;">

    <!-- SUPER ADMIN ONLY: SUB-ADMINS -->
    <section class="card" id="super-admin-section" style="display: none;">
      <div class="card-title">
        <span>👑 Sub-Admin Accounts Management</span>
      </div>
      <form onsubmit="handleCreateAdmin(event)" style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 0.75rem; align-items: end;">
        <div>
          <label>New Admin Username</label>
          <input type="text" id="new-admin-user" required placeholder="admin_user">
        </div>
        <div>
          <label>Password</label>
          <input type="password" id="new-admin-pass" required placeholder="••••••••">
        </div>
        <div>
          <label>Role</label>
          <select id="new-admin-role">
            <option value="admin">Standard Admin</option>
            <option value="super_admin">Super Admin</option>
          </select>
        </div>
        <button class="btn btn-sm" type="submit" style="height: 38px;">Add Admin</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Role</th>
            <th>Created</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="admins-table-body"></tbody>
      </table>
    </section>

    <!-- CLIENT USER / LICENSE MANAGEMENT -->
    <section class="card">
      <div class="card-title">
        <span>👤 Authorized Users (Validation Control)</span>
      </div>

      <form onsubmit="handleCreateUser(event)" style="display: grid; grid-template-columns: 1fr 1fr 1fr auto; gap: 0.75rem; align-items: end;">
        <div>
          <label>Username</label>
          <input type="text" id="new-user-name" required placeholder="client_user">
        </div>
        <div>
          <label>Password</label>
          <input type="password" id="new-user-pass" required placeholder="••••••••">
        </div>
        <div>
          <label>Expiry (Days, 0 for infinite)</label>
          <input type="number" id="new-user-days" value="30">
        </div>
        <button class="btn btn-sm" type="submit" style="height: 38px;">Grant Access</button>
      </form>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Username</th>
            <th>Status</th>
            <th>Expires</th>
            <th>Created By</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="users-table-body"></tbody>
      </table>
    </section>
  </main>

  <script>
    let token = localStorage.getItem('donzy_token');
    let currentUser = JSON.parse(localStorage.getItem('donzy_user') || 'null');

    function checkAuth() {
      if (token && currentUser) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('app-header').style.display = 'flex';
        document.getElementById('dashboard-screen').style.display = 'block';
        document.getElementById('admin-user-display').innerText = currentUser.username;

        const badge = document.getElementById('role-badge');
        badge.innerText = currentUser.role.replace('_', ' ');
        badge.className = 'badge ' + (currentUser.role === 'super_admin' ? 'badge-super' : 'badge-admin');

        if (currentUser.role === 'super_admin') {
          document.getElementById('super-admin-section').style.display = 'block';
          loadAdmins();
        } else {
          document.getElementById('super-admin-section').style.display = 'none';
        }

        loadUsers();
      } else {
        document.getElementById('auth-screen').style.display = 'block';
        document.getElementById('app-header').style.display = 'none';
        document.getElementById('dashboard-screen').style.display = 'none';
      }
    }

    async function handleLogin(e) {
      e.preventDefault();
      const errBox = document.getElementById('login-error');
      errBox.style.display = 'none';

      const username = document.getElementById('login-username').value;
      const password = document.getElementById('login-password').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password })
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Login failed');

        localStorage.setItem('donzy_token', data.token);
        localStorage.setItem('donzy_user', JSON.stringify(data.user));
        token = data.token;
        currentUser = data.user;
        checkAuth();
      } catch (err) {
        errBox.innerText = err.message;
        errBox.style.display = 'block';
      }
    }

    function logout() {
      localStorage.removeItem('donzy_token');
      localStorage.removeItem('donzy_user');
      token = null;
      currentUser = null;
      checkAuth();
    }

    async function loadUsers() {
      try {
        const res = await fetch('/api/users', { headers: { 'Authorization': 'Bearer ' + token } });
        if (res.status === 401 || res.status === 403) return logout();
        const users = await res.json();

        const tbody = document.getElementById('users-table-body');
        tbody.innerHTML = users.map(u => `
          <tr>
            <td>#${u.id}</td>
            <td><strong>${u.username}</strong></td>
            <td><span class="status-${u.status}">${u.status.toUpperCase()}</span></td>
            <td>${u.expires_at ? new Date(u.expires_at).toLocaleDateString() : 'Never'}</td>
            <td>${u.created_by}</td>
            <td>
              <button class="btn btn-sm btn-secondary" onclick="toggleStatus(${u.id}, '${u.status}')">
                ${u.status === 'active' ? 'Suspend' : 'Activate'}
              </button>
              <button class="btn btn-sm btn-danger" onclick="deleteUser(${u.id})">Delete</button>
            </td>
          </tr>
        `).join('');
      } catch (e) { console.error(e); }
    }

    async function loadAdmins() {
      try {
        const res = await fetch('/api/admins', { headers: { 'Authorization': 'Bearer ' + token } });
        const admins = await res.json();
        const tbody = document.getElementById('admins-table-body');
        tbody.innerHTML = admins.map(a => `
          <tr>
            <td>#${a.id}</td>
            <td><strong>${a.username}</strong></td>
            <td><span class="badge ${a.role === 'super_admin' ? 'badge-super' : 'badge-admin'}">${a.role}</span></td>
            <td>${new Date(a.created_at).toLocaleDateString()}</td>
            <td>
              ${a.id !== currentUser.id ? `<button class="btn btn-sm btn-danger" onclick="deleteAdmin(${a.id})">Remove</button>` : '<em style="color:var(--text-muted);">Current</em>'}
            </td>
          </tr>
        `).join('');
      } catch (e) { console.error(e); }
    }

    async function handleCreateUser(e) {
      e.preventDefault();
      const username = document.getElementById('new-user-name').value;
      const password = document.getElementById('new-user-pass').value;
      const expires_days = document.getElementById('new-user-days').value;

      const res = await fetch('/api/users', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ username, password, expires_days })
      });
      const data = await res.json();
      if (!res.ok) alert(data.error);
      else {
        e.target.reset();
        loadUsers();
      }
    }

    async function handleCreateAdmin(e) {
      e.preventDefault();
      const username = document.getElementById('new-admin-user').value;
      const password = document.getElementById('new-admin-pass').value;
      const role = document.getElementById('new-admin-role').value;

      const res = await fetch('/api/admins', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ username, password, role })
      });
      const data = await res.json();
      if (!res.ok) alert(data.error);
      else {
        e.target.reset();
        loadAdmins();
      }
    }

    async function toggleStatus(id, current) {
      const next = current === 'active' ? 'suspended' : 'active';
      await fetch(`/api/users/${id}/status`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ status: next })
      });
      loadUsers();
    }

    async function deleteUser(id) {
      if (!confirm('Are you sure you want to revoke this user access?')) return;
      await fetch(`/api/users/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      loadUsers();
    }

    async function deleteAdmin(id) {
      if (!confirm('Are you sure you want to remove this admin?')) return;
      await fetch(`/api/admins/${id}`, {
        method: 'DELETE',
        headers: { 'Authorization': 'Bearer ' + token }
      });
      loadAdmins();
    }

    checkAuth();
  </script>
</body>
</html>
